# Cuts a release from the Conventional Commits since the last v* tag (scripts/version.ts): the next semver version, the
# changelog, the four `orch` binaries with SHA256SUMS and the container image. Run it from the Actions tab.
# publish=false (the default) is the dry run: it builds and tests everything and publishes nothing.
#
# Two jobs, so each holds only the permissions it needs. `release` works out and proves the release, and when publishing
# makes the one irreversible step (the commit and tag go up together). `publish` then pushes the image and creates the
# GitHub release from that tag. If `publish` fails, use "Re-run failed jobs": running the whole workflow again finds
# nothing to release, because the tag is already there.
#
# Needs: pushes to the default branch by github-actions[bot] must be allowed if the branch is protected.
name: Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish: commit the version, tag it, push the image and create the GitHub release (off = dry run)"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release

env:
  BUN_VERSION: 1.4.2

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # the release commit and the tag
      actions: read # to find the green CI run of this commit
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - name: Publishing is only from the default branch
        if: inputs.publish && github.ref_name != github.event.repository.default_branch
        run: |
          echo "::error::Publish from ${{ github.event.repository.default_branch }}, not from $GITHUB_REF_NAME. Use the dry run on other branches."
          exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the tags and the commits since the last one
      - name: Publishing needs a green CI run on this exact commit
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          green=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --status success --json databaseId --jq length)
          if [ "$green" -lt 1 ]; then
            echo "::error::No successful CI run for $GITHUB_SHA. Wait for CI on this commit, or fix it, then publish."
            exit 1
          fi
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Next version
        id: next
        run: |
          version=$(bun scripts/version.ts --apply --notes dist/notes.md)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -z "$version" ]; then
            echo "Nothing releasable since the last tag." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            { echo "Release **v$version**"; echo; cat dist/notes.md; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: The lock still agrees with the new version
        if: steps.next.outputs.version != ''
        run: bun install --frozen-lockfile
      - name: Binaries
        if: steps.next.outputs.version != ''
        run: bun run release:build
      - name: Image builds and passes its test
        if: steps.next.outputs.version != ''
        run: deploy/image-test.sh "ghcr.io/${GITHUB_REPOSITORY,,}:${{ steps.next.outputs.version }}"
      - uses: actions/upload-artifact@v4
        if: steps.next.outputs.version != ''
        with:
          name: release-v${{ steps.next.outputs.version }}
          path: |
            dist/release/
            dist/notes.md
      # The point of no return: the commit and the tag go up together or not at all.
      - name: Commit and tag
        if: steps.next.outputs.version != '' && inputs.publish
        run: |
          version=${{ steps.next.outputs.version }}
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/cli/package.json bun.lock CHANGELOG.md
          git commit --message "chore(release): v$version"
          git tag --annotate "v$version" --message "v$version"
          git push --atomic origin "HEAD:${GITHUB_REF_NAME}" "v$version"

  publish:
    needs: release
    if: inputs.publish && needs.release.outputs.version != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write # the GitHub release
      packages: write # the image in ghcr.io
    env:
      VERSION: ${{ needs.release.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.release.outputs.version }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: release-v${{ needs.release.outputs.version }}
          path: dist
      # Built again from the tag and tested before it is pushed: what is pushed is what was tested.
      - name: Push the image
        run: |
          image=ghcr.io/${GITHUB_REPOSITORY,,}
          docker build --tag "$image:$VERSION" .
          SKIP_BUILD=1 deploy/image-test.sh "$image:$VERSION"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for tag in "$VERSION" "${VERSION%.*}" latest; do
            docker tag "$image:$VERSION" "$image:$tag"
            docker push "$image:$tag"
          done
      - name: Create the GitHub release
        run: gh release create "v$VERSION" dist/release/* --title "v$VERSION" --notes-file dist/notes.md --verify-tag
