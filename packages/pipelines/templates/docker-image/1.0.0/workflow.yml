# docker-image as a GitHub Actions workflow: build on pull requests, and on the default branch push to GitHub's container registry (ghcr.io).
# The runner has Docker, so there is no docker-in-docker service and `dockerVersion` has no effect here.
# Actions are pinned to a commit (checkout v7.0.1). The image name must be lower case in ghcr.io, and the repository's name need not be.
name: docker-image
on:
  pull_request: {}
  push: {}
permissions:
  contents: read
jobs:
  # pull requests only prove the image builds: nothing is pushed from a branch that is not merged
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: 'docker build --pull -f "{{ params.dockerfile }}" "{{ params.context }}"'
  publish:
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          image="ghcr.io/$(printf %s "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          tag="$(printf %s "$GITHUB_SHA" | cut -c1-8)"
          printf %s "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build --pull -f "{{ params.dockerfile }}" -t "$image:$tag" -t "$image:latest" "{{ params.context }}"
          docker push "$image:$tag"
          docker push "$image:latest"
