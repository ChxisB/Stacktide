# node-app as a GitHub Actions workflow: the jobs of pipeline.yml, on pull requests and the default branch.
# Actions are pinned to a commit (checkout v7.0.1, upload-artifact v7.0.2). Differences from the GitLab pipeline:
# no npm cache (every job installs for itself, as the GitLab one is written to), and the build job waits for the checks with `needs`.
name: node-app
on:
  pull_request: {}
  push: {}
# the workflow reads the repository and nothing else; none of these jobs calls the platform, so none asks for an OIDC token
permissions:
  contents: read
jobs:
  typecheck:
    if: &gate github.event_name == 'pull_request' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    container: "node:{{ params.nodeVersion }}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: npm ci
      - run: "npm run {{ params.typecheckScript }}"
  lint:
    if: *gate
    runs-on: ubuntu-latest
    container: "node:{{ params.nodeVersion }}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: npm ci
      - run: "npm run {{ params.lintScript }}"
  test:
    if: *gate
    runs-on: ubuntu-latest
    container: "node:{{ params.nodeVersion }}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: npm ci
      - run: "npm run {{ params.testScript }}"
  build:
    if: *gate
    needs: [typecheck, lint, test]
    runs-on: ubuntu-latest
    container: "node:{{ params.nodeVersion }}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: npm ci
      - run: "npm run {{ params.buildScript }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: build
          path: "{{ params.buildOutput }}"
          retention-days: 7
